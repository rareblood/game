<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解压小游戏合集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #fff; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 30px 20px; text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        .game-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 600px; margin: 0 auto; }
        .game-card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 24px 20px; width: 160px; cursor: pointer; transition: 0.2s; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .game-card:hover { background: rgba(255,255,255,0.15); transform: scale(1.03); }
        .game-icon { font-size: 3rem; margin-bottom: 10px; }
        .game-name { font-weight: 700; margin-bottom: 4px; }
        .game-desc { font-size: 0.8rem; color: #ccc; }
    </style>
</head>
<body>
    <h1>🎮 解压小游戏合集</h1>
    <p class="subtitle">点击卡片即可游玩</p>
    <div class="game-list">
        <a class="game-card" href="./color-game/">
            <div class="game-icon">🎨</div>
            <div class="game-name">辨色达人</div>
            <div class="game-desc">10关辨色挑战</div>
        </a>
        <a class="game-card" href="./memory-dots/">
            <div class="game-icon">💡</div>
            <div class="game-name">节奏光点</div>
            <div class="game-desc">记忆闪击挑战</div>
        </a>
        <a class="game-card" href="./Idiom Hunt/">
            <div class="game-icon">💡</div>
            <div class="game-name">成语挑战</div>
            <div class="game-desc">文曲星成语挑战</div>
        </a>
        <a class="game-card" href="./make-24/">
            <div class="game-icon">💡</div>
            <div class="game-name">24点挑战</div>
            <div class="game-desc">24点挑战</div>
        </a>
    </div>
</body>
</html>
